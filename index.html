<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Chibi Cổ Trang 2.5D · V0.5</title><style>
*{box-sizing:border-box}body{margin:0;background:#161d19;font-family:Georgia,'Times New Roman',serif;color:#53331e;display:flex;justify-content:center;align-items:center;min-height:100dvh}button{font:inherit;cursor:pointer;touch-action:manipulation}.phone{width:min(100vw,480px);height:100dvh;max-height:920px;position:relative;overflow:hidden;background:#d9c3a2;box-shadow:0 0 30px #0008}.scene{position:absolute;inset:0;background:url('assets/home.png') center center/100% 100% no-repeat}.hotspot{position:absolute;background:transparent;border:0;border-radius:30px;z-index:5;outline:none}.hotspot:active{background:#ffe9a344}.petal{position:absolute;top:-8%;z-index:4;color:#f5a4bc;text-shadow:0 1px 2px #a45d74;font-size:16px;pointer-events:none;animation:fall linear infinite}@keyframes fall{to{transform:translate(80px,110vh) rotate(560deg)}}.fish{position:absolute;bottom:10%;left:61%;font-size:20px;z-index:4;animation:jump 4s ease-in-out infinite;pointer-events:none}@keyframes jump{0%,70%,100%{transform:translateY(0) rotate(0);opacity:0}78%{transform:translateY(-30px) rotate(-20deg);opacity:1}88%{transform:translateY(0) rotate(15deg);opacity:1}}.hint{position:absolute;bottom:7.5%;left:12%;right:12%;z-index:7;text-align:center;background:#fff2d8e8;border:2px solid #a97842;border-radius:18px;padding:7px;font-size:12px;pointer-events:none}.panel{position:absolute;inset:0;z-index:20;background:linear-gradient(#b9d5b3,#efe0bb 25%,#e9d1a6);display:none;flex-direction:column}.panel.show{display:flex}.head{height:58px;flex-shrink:0;background:linear-gradient(#7d4625,#c28a4c 22%,#f5d9a1 55%,#b77c43);border-bottom:4px ridge #82502c;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:24px;text-shadow:0 1px #fff3d6}.close{position:absolute;right:9px;top:8px;border:2px solid #ffe4a7;border-radius:50%;width:41px;height:41px;background:#b74431;color:white;font-size:23px;z-index:30}.back{position:absolute;left:9px;top:10px;background:#805330;color:#fff0d2;border:2px solid #dcb978;border-radius:10px;padding:8px;z-index:30}.scroll{overflow-y:auto;flex:1;padding:12px 12px 90px}.art{width:100%;height:38%;min-height:230px;object-fit:fill;border:4px ridge #a6753f;border-radius:12px;box-shadow:0 3px 10px #56351b5c}.title{font-weight:bold;font-size:18px;text-align:center;margin:12px 0 9px}.tabs{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:8px 0 12px}.tab,.action{background:linear-gradient(#fff4d6,#e5ba7d);border:2px solid #ad7441;color:#653b1e;border-radius:9px;padding:9px 10px;font-weight:bold;font-size:13px}.tab.on,.action.primary{background:linear-gradient(#ffd994,#d77b3b);color:#603018;border-color:#a85d24}.card{background:#fff4d9e8;border:2px solid #b88b58;border-radius:12px;padding:12px;margin:9px 0;box-shadow:0 2px 5px #8c65402b}.item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 2px;border-bottom:1px solid #b18a6355}.item:last-child{border:0}.muted{font-size:12px;color:#856a4d}.chip{display:inline-block;background:#e7c995;border-radius:20px;padding:5px 9px;margin:3px;font-size:13px}.mapFarm{height:48%;min-height:310px;background:linear-gradient(#ffffff18,#fff4d522),url('assets/farm.png') center/100% 100%;border:4px ridge #aa7948;border-radius:12px;position:relative}.farmHot{position:absolute;background:#f7d69cc7;border:1px solid #8c572a;border-radius:8px;padding:6px 5px;font-weight:bold;font-size:12px;box-shadow:0 2px 3px #3c261f77}.plots{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}.plot{aspect-ratio:1.05;border:2px solid #9a5e30;border-radius:8px;background:radial-gradient(#8c5a36 10%,#ac7246 70%);color:#fff5d8;text-shadow:0 1px #5b3820;font-size:24px}.plot small{display:block;font-size:9px}.plot:active{transform:scale(.96)}.bottom{position:absolute;bottom:0;left:0;right:0;z-index:24;display:flex;justify-content:space-around;gap:3px;padding:8px 4px;background:linear-gradient(#e9c88e,#a56d3c);border-top:3px ridge #86552c}.bottom button{font-size:12px;padding:8px 5px;background:#ffebc4;border:1px solid #a36b38;border-radius:9px}.toast{position:absolute;z-index:60;bottom:85px;left:8%;width:84%;padding:11px;background:#4e3326ed;color:#fff0d2;border:2px solid #edca8d;border-radius:12px;text-align:center;display:none}.toast.show{display:block}.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.small{font-size:12px}.intro{position:absolute;top:12%;left:10%;right:10%;z-index:8;text-align:center;background:#fff0cbe8;border:2px solid #b8854b;border-radius:14px;padding:9px;font-size:12px;animation:fadeout 1s 5s forwards;pointer-events:none}@keyframes fadeout{to{opacity:0}}@media(min-width:550px){.phone{height:92dvh;border:7px solid #35251b;border-radius:20px}}

.auth{position:absolute;inset:0;z-index:100;background:linear-gradient(180deg,#18221e99,#24190dbb),url('assets/home.png') center/cover;display:flex;align-items:center;justify-content:center;padding:22px}.auth.hidden{display:none}.authbox{width:100%;max-width:390px;padding:24px 22px 18px;border:5px double #94622c;border-radius:22px;background:linear-gradient(155deg,#fff1d4,#e8c991);box-shadow:0 15px 45px #160d08dd,inset 0 0 0 3px #f9e8bf;text-align:center}.authbox h1{font-size:30px;margin:4px 0;color:#723b21;text-shadow:0 1px #fff}.authbox .sub{font-size:13px;margin:0 0 18px}.authbox label{display:block;text-align:left;font-size:14px;font-weight:bold;margin:12px 0 5px}.authbox input{width:100%;border:2px solid #b8894c;border-radius:10px;background:#fff9e9;padding:12px;font:16px Arial;color:#472b1b}.authbtn{display:block;width:100%;padding:13px;margin-top:15px;border:2px solid #f6d79a;border-radius:12px;background:linear-gradient(#d97b45,#9e3f28);color:#fff5d7;font-weight:bold;font-size:18px}.authbtn.alt{background:linear-gradient(#a47c45,#6f4c2b);margin-top:8px}.autherr{min-height:22px;color:#a32b1e;font:13px Arial;margin-top:8px}.authnote{font:12px/1.5 Arial;color:#765334;margin-top:14px}.logout{position:absolute;z-index:9;top:8%;right:8px;border:1px solid #ffe7b2;border-radius:12px;background:#6b3d28e8;color:#fff0ce;font:12px Arial;padding:7px 9px}.userbadge{position:absolute;z-index:9;top:8%;left:8px;background:#fff0c9e8;border-radius:10px;padding:6px;font:12px Arial;color:#4d321c}
</style></head><body><main class="phone"><div class="scene" id="scene"></div><div class="intro">Bản xem trước 2.5D · Chạm vào tên công trình để mở</div><div class="fish">🐟</div><div id="petals"></div><div class="hint">🌸 Trang chủ Chibi 2.5D · Chạm vào công trình</div><div id="hotspots"></div><section id="panel" class="panel"><div class="head" id="heading">Nông Trại</div><button class="close" onclick="home()">×</button><div id="contents" class="scroll"></div><div class="bottom"><button onclick="home()">🏡 Trang chủ</button><button onclick="openBuilding('shop')">🛒 Cửa Hàng</button><button onclick="openBuilding('farm')">🌱 Nông Trại</button><button onclick="openBuilding('main')">🏯 Nhà Chính</button></div></section><div class="toast" id="toast"></div><div class="userbadge" id="userbadge" hidden></div><button class="logout" id="logout" hidden onclick="logoutGame()">Đăng xuất</button><section class="auth" id="auth"><div class="authbox"><div style="font-size:32px">🌸 🏯 🌸</div><h1>Chibi Cổ Trang</h1><p class="sub">Thế giới tiên hiệp · Bản xem thử offline</p><form id="loginform" onsubmit="return submitLogin(event)"><label for="username">Tên tài khoản</label><input id="username" maxlength="24" autocomplete="username" required placeholder="Nhập tên tài khoản"><label for="password">Mật khẩu</label><input id="password" type="password" maxlength="64" minlength="4" autocomplete="current-password" required placeholder="Ít nhất 4 ký tự"><div class="autherr" id="autherr"></div><button class="authbtn" type="submit" id="loginbutton">Đăng nhập</button><button class="authbtn alt" type="button" onclick="registerGame()">Đăng ký tài khoản</button></form><p class="authnote">Tài khoản thử chỉ lưu trên trình duyệt này. Không dùng mật khẩu thật; xóa dữ liệu trình duyệt có thể mất tài khoản.</p></div></section></main><script>
const names={main:'Nhà Chính',shop:'Cửa Hàng',farm:'Nông Trại',pets:'Nhà Pet',guards:'Thị Vệ',beauty:'Hồng Nhan'};
const spots=[['main',39,28,29,12],['shop',9,39,34,12],['farm',5,60,40,12],['pets',58,71,36,12],['guards',63,52,32,12],['beauty',64,24,33,12]];
const hs=document.getElementById('hotspots');spots.forEach(([id,x,y,w,h])=>{let b=document.createElement('button');b.className='hotspot';b.setAttribute('aria-label',names[id]);b.style.cssText=`left:${x}%;top:${y}%;width:${w}%;height:${h}%`;b.onclick=()=>openBuilding(id);hs.append(b)});
for(let i=0;i<17;i++){let p=document.createElement('div');p.className='petal';p.textContent=i%3?'❀':'🌸';p.style.left=(i*37%100)+'%';p.style.animationDuration=(7+i%6*2)+'s';p.style.animationDelay=(-i*1.9)+'s';document.getElementById('petals').append(p)}
let storeKey='chibi25dv05_guest';let saved={};try{saved=JSON.parse(localStorage.getItem(storeKey)||'{}')}catch(e){};let state=Object.assign({gold:5000,cards:3,levels:{main:1,shop:1,farm:1,pets:1,guards:1,beauty:1},plots:Array(20).fill(''),inventory:{'Dâu tây':2},upgrades:{}},saved);function persist(){try{localStorage.setItem(storeKey,JSON.stringify(state))}catch(e){}};
function notify(s){let t=document.getElementById('toast');t.textContent=s;t.classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>t.classList.remove('show'),2400)}
function home(){document.getElementById('panel').classList.remove('show')};let current='farm',currentTab=0;
function openBuilding(id){current=id;currentTab=0;document.getElementById('panel').classList.add('show');document.getElementById('heading').textContent=names[id];render()}
function btn(s,fun,cls=''){return `<button class="action ${cls}" onclick="${fun}">${s}</button>`}
function tabs(arr){return `<div class="tabs">${arr.map((x,i)=>`<button class="tab ${currentTab===i?'on':''}" onclick="currentTab=${i};render()">${x}</button>`).join('')}</div>`}
function image(n){return `<img class="art" src="assets/${n}.png" alt="Giao diện ${names[current]}">`}
function render(){let c=document.getElementById('contents');let html='';if(current==='farm')html=farm();else if(current==='main')html=main();else if(current==='shop')html=shop();else html=other();c.innerHTML=html}
function farm(){let tt=['Bản đồ','Trồng trọt','Chăn nuôi','Làm bánh','Nước uống','Trang phục','Nhà Kho'];let s=tabs(tt);if(currentTab===0){s+=`<div class="mapFarm"><button class="farmHot" style="top:12%;left:5%" onclick="currentTab=6;render()">🏚 Nhà Kho</button><button class="farmHot" style="top:12%;right:3%" onclick="currentTab=3;render()">🥐 Xưởng Bánh</button><button class="farmHot" style="top:43%;right:2%" onclick="currentTab=4;render()">🥤 Xưởng Nước</button><button class="farmHot" style="top:66%;right:2%" onclick="currentTab=5;render()">🧵 Xưởng Trang Phục</button><button class="farmHot" style="top:44%;left:4%" onclick="currentTab=1;render()">🌱 20 ô đất</button><button class="farmHot" style="bottom:5%;left:22%" onclick="currentTab=2;render()">🐄 Chăn nuôi</button></div><div class="card">Bản đồ nông trại riêng · 20 ô đất (4 hàng × 5 ô), bò, gà, cừu, chó và 3 xưởng. Chạm các nhãn để mở khu vực.</div>`}
if(currentTab===1){s+=`<div class="card"><b>🌱 Trồng trọt · 20 ô (4 × 5)</b><p class="small">Chạm vào ô đất trống để gieo Dâu tây. Chạm lần nữa để thu hoạch.</p><div class="plots">${state.plots.map((p,i)=>`<button class="plot" onclick="plotClick(${i})">${p?'🍓':'✦'}<small>${i+1}</small></button>`).join('')}</div></div><div class="card"><b>Giống cây:</b><div>${['Dâu tây','Dứa','Dưa hấu','Khoai mì','Cà chua','Ớt chuông'].map(x=>`<span class="chip">${x}</span>`).join('')}</div><p class="muted">Bản thử nghiệm dùng Dâu tây; các giống còn lại đang ở giao diện minh họa.</p><div class="tabs">${['Tưới nước','Bón phân','Bắt sâu','Thu hoạch'].map(x=>btn(x,`notify('Đã chọn: ${x}')`)).join('')}</div></div>`}
if(currentTab===2)s+=`<div class="card"><b>🐄 Khu chăn nuôi</b>${[['🐄 Bò','Sữa, da'],['🐔 Gà','Trứng, thịt'],['🐑 Cừu','Sữa, lông'],['🐕 Chó','Canh giữ nông trại']].map(x=>`<div class="item"><span>${x[0]}<div class="muted">${x[1]}</div></span>${btn('Chăm sóc',`notify('Đang xem khu ${x[0]}')`)}</div>`).join('')}<div class="tabs">${btn('Cho ăn',"notify('Đã cho vật nuôi ăn')")}${btn('Giải trí',"notify('Vật nuôi đang vui chơi')")}${btn('Thu hoạch',"notify('Chức năng thu hoạch sẽ hoàn thiện sau')")}</div></div>`;
if(currentTab>=3&&currentTab<=5){let x=[['Bánh dâu','Bánh dứa','Bánh dưa hấu','Bánh mì'],['Nước dâu','Nước dứa','Nước dưa hấu','Sữa bò','Sữa cừu'],['Trang phục nam','Trang phục nữ','Ngoại trang đặc biệt']][currentTab-3];s+=`<div class="card"><b>🏭 ${tt[currentTab]}</b><p class="muted">Chọn công thức để xem. Chế tạo thật sẽ được bổ sung khi có hệ thống nguyên liệu đầy đủ.</p>${x.map(z=>`<div class="item">${z} ${btn('Xem',`notify('Công thức ${z}: đang thiết kế')`)}</div>`).join('')}</div>`}
if(currentTab===6)s+=`<div class="card"><b>📦 Nhà Kho</b>${Object.entries(state.inventory).map(([k,v])=>`<div class="item">${k}<b>×${v}</b></div>`).join('')}<p class="muted">Lưu nông sản và vật phẩm thu hoạch.</p></div>`;return s}
function plotClick(i){if(state.plots[i]){state.plots[i]='';state.inventory['Dâu tây']=(state.inventory['Dâu tây']||0)+1;notify('Thu hoạch +1 Dâu tây')}else{state.plots[i]='Dâu tây';notify('Đã gieo Dâu tây')}persist();render()}
function main(){let tabsList=['Tổng quan','Nâng cấp công trình'];let s=tabs(tabsList);if(currentTab===0)s+=`${image('main')}<div class="card"><b>🏯 Nhà Chính · Cấp ${state.levels.main}</b><p>Quản lý nâng cấp toàn bộ công trình, mỗi công trình có thời gian xây dựng riêng.</p>${btn('Quản lý nâng cấp', 'currentTab=1;render()', 'primary')}</div>`;else s+=`<div class="card"><b>💰 Tiền: ${state.gold.toLocaleString('vi-VN')} · ⏩ Thẻ: ${state.cards}</b>${Object.entries(names).filter(([id])=>id!=='main').map(([id,n])=>{let lv=state.levels[id],end=state.upgrades[id],left=end?Math.max(0,Math.ceil((end-Date.now())/60000)):0;return `<div class="item"><span><b>${n}</b><div class="muted">Cấp ${lv} → ${lv+1} · ${end?`Còn ${left} phút`:'Chưa xây dựng'}</div></span><span>${end?btn('⏩ -1h',`speed('${id}')`):btn('Nâng',`upgrade('${id}')`)}</span></div>`}).join('')}<p class="muted">Mỗi thẻ rút ngắn 60 phút. Cấp tiếp theo cần ${500} xu trở lên.</p></div>`;return s}
function upgrade(id){let cost=state.levels[id]*500;if(state.gold<cost)return notify('Không đủ xu');state.gold-=cost;state.upgrades[id]=Date.now()+state.levels[id]*60*60*1000;persist();render();notify('Bắt đầu nâng cấp '+names[id])}
function speed(id){if(!state.cards)return notify('Hết thẻ tăng tốc');state.cards--;state.upgrades[id]-=3600000;checkUpgrade(id);persist();render();notify('Đã rút ngắn 1 giờ')}
function checkUpgrade(id){if(state.upgrades[id]&&Date.now()>=state.upgrades[id]){delete state.upgrades[id];state.levels[id]++;persist();notify(names[id]+' nâng cấp thành công!')}}
setInterval(()=>{let old=JSON.stringify(state.upgrades);Object.keys(state.upgrades).forEach(checkUpgrade);if(current==='main'&&currentTab===1&&document.getElementById('panel').classList.contains('show'))render()},15000);
function shop(){let arr=['Đạo cụ','Hạt giống',"Pet's Shop",'Thị Vệ','Trang bị'];let s=tabs(arr);if(currentTab===0)s+=`<div class="card"><b>⏩ Thẻ Tăng Tốc Xây Dựng</b><p>Rút ngắn 1 giờ nâng cấp công trình / thẻ.</p><div class="item">Giá thử nghiệm: 200 xu · Đang có ${state.cards} thẻ ${btn('Mua', 'buyCard()', 'primary')}</div></div>`;else s+=`${image('shop')}<div class="card">${arr[currentTab]} · Danh mục đang thiết kế, chưa mở mua bán thật.</div>`;return s}
function buyCard(){if(state.gold<200)return notify('Không đủ xu');state.gold-=200;state.cards++;persist();render();notify('Đã mua 1 thẻ tăng tốc')}
function other(){let dict={pets:['Danh sách','Nâng cấp','Kỹ năng','Trang bị','Tăng sao'],guards:['Danh sách','Trang bị','Kỹ năng','Tăng sao','Ngoại trang'],beauty:['Danh sách','Tăng cấp','Thân mật','Ban thưởng','Tổ đội kết hợp']};let arr=dict[current];return tabs(arr)+image(current)+`<div class="card"><b>${arr[currentTab]}</b><p>Khung giao diện ${names[current]} theo bản thiết kế hôm nay. Hình minh họa đã có; dữ liệu nhân vật và chức năng chuyên sâu sẽ được lập trình ở bản sau.</p></div>`}

// Offline-only demonstration account system. Not secure authentication.
const auth=document.getElementById('auth'), autherr=document.getElementById('autherr');
function accounts(){try{return JSON.parse(localStorage.getItem('chibi25d_demo_accounts')||'{}')}catch(e){return {}}}
function accountHash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return String(h>>>0)}
function credentials(){return [document.getElementById('username').value.trim().toLowerCase(),document.getElementById('password').value]}
function enterGame(u){storeKey='chibi25dv05_user_'+u;let data={};try{data=JSON.parse(localStorage.getItem(storeKey)||'{}')}catch(e){};state=Object.assign({gold:5000,cards:3,levels:{main:1,shop:1,farm:1,pets:1,guards:1,beauty:1},plots:Array(20).fill(''),inventory:{'Dâu tây':2},upgrades:{}},data);auth.classList.add('hidden');document.getElementById('userbadge').hidden=false;document.getElementById('userbadge').textContent='👤 '+u;document.getElementById('logout').hidden=false;home();sessionStorage.setItem('chibi25d_active',u)}
function submitLogin(e){e.preventDefault();const [u,p]=credentials(),a=accounts();if(!a[u]||a[u]!==accountHash(u+'|'+p)){autherr.textContent='Sai tên tài khoản hoặc mật khẩu.';return false}autherr.textContent='';enterGame(u);return false}
function registerGame(){const [u,p]=credentials();if(!/^[a-z0-9_]{3,24}$/.test(u)){autherr.textContent='Tên tài khoản: 3–24 ký tự, chỉ chữ không dấu, số hoặc _.';return}if(p.length<4){autherr.textContent='Mật khẩu phải có ít nhất 4 ký tự.';return}let a=accounts();if(a[u]){autherr.textContent='Tài khoản đã tồn tại.';return}a[u]=accountHash(u+'|'+p);try{localStorage.setItem('chibi25d_demo_accounts',JSON.stringify(a))}catch(e){autherr.textContent='Không thể lưu tài khoản trên trình duyệt này.';return}autherr.textContent='';enterGame(u);notify('Đăng ký thành công!')}
function logoutGame(){persist();sessionStorage.removeItem('chibi25d_active');auth.classList.remove('hidden');document.getElementById('userbadge').hidden=true;document.getElementById('logout').hidden=true;document.getElementById('password').value='';home()}
try{const u=sessionStorage.getItem('chibi25d_active');if(u&&accounts()[u])enterGame(u)}catch(e){}
</script></body></html>
